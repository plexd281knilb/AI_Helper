version: '3.8'

services:
  ai-helper:
    build: .
    container_name: ai_helper
    restart: unless-stopped
    labels:
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/plexd281knilb/AI_Helper/main/static/images/ai-helper-logo.png"
      - "org.opencontainers.image.icon=https://raw.githubusercontent.com/plexd281knilb/AI_Helper/main/static/images/ai-helper-logo.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:8000]/"
    ports:
      - "8000:8000"
    environment:
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
